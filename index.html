<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GadgetStore - Toko Gadget Impianmu</title>
  <style>
    /* --- RESET & BASIC STYLES --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- NAVBAR --- */
    header {
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-light);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent);
    }

    .cart-btn {
      position: relative;
      background: var(--primary);
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .cart-btn:hover {
      background: var(--primary-hover);
    }

    .cart-count {
      background: #ef4444;
      color: white;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 50%;
      margin-left: 5px;
    }

    /* --- HERO & FILTER --- */
    .hero {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
    }

    .filter-container {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin: 1.5rem 0 2.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* --- PRODUCT GRID --- */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      flex: 1;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .product-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #000;
    }

    .product-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .product-title {
      font-size: 1.1rem;
      margin: 0.4rem 0;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 1rem;
    }

    .product-actions {
      margin-top: auto;
      display: flex;
      gap: 0.5rem;
    }

    .btn-detail {
      flex: 1;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-detail:hover {
      background: var(--accent);
      color: var(--bg-dark);
    }

    .btn-add {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-add:hover {
      background: var(--primary-hover);
    }

    /* --- MODAL DETAIL & VIDEO --- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      font-size: 1.5rem;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    .video-container {
      width: 100%;
      background: #000;
      max-height: 320px;
    }

    .video-container video {
      width: 100%;
      max-height: 320px;
      display: block;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-body h2 {
      margin-bottom: 0.5rem;
    }

    .modal-body p {
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .modal-body .modal-price {
      font-size: 1.3rem;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 1rem;
    }

    /* --- FOOTER --- */
    footer {
      background: #0b1120;
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">Gadget<span>Store</span></a>
      <button class="cart-btn">
        🛒 Keranjang <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h1>Koleksi Gadget Terbaru</h1>
    <p>Temukan Smartphone, Laptop, dan Tablet pilihan terbaik di sini.</p>
    
    <!-- FILTER KATEGORI -->
    <div class="filter-container">
      <button class="filter-btn active" onclick="filterCategory('all')">Semua</button>
      <button class="filter-btn" onclick="filterCategory('hp')">Smartphone</button>
      <button class="filter-btn" onclick="filterCategory('laptop')">Laptop</button>
      <button class="filter-btn" onclick="filterCategory('tablet')">Tablet</button>
    </div>
  </section>

  <!-- MAIN PRODUCT LIST -->
  <main class="main-container">
    <div class="product-grid" id="productGrid">
      <!-- Produk di-render melalui JavaScript -->
    </div>
  </main>

  <!-- MODAL DETAIL & VIDEO PRODUK -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <div class="video-container">
        <!-- Video produk lokal -->
        <video id="modalVideo" controls poster="">
          <source id="videoSource" src="" type="video/mp4">
          Browser Anda tidak mendukung tag video.
        </video>
      </div>
      <div class="modal-body">
        <h2 id="modalTitle">Nama Produk</h2>
        <div class="modal-price" id="modalPrice">Rp 0</div>
        <p id="modalDesc">Deskripsi produk akan muncul di sini.</p>
        <button class="btn-add" style="width: 100%; padding: 0.8rem;" onclick="addToCartFromModal()">
          + Tambahkan ke Keranjang
        </button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 GadgetStore. All rights reserved.</p>
  </footer>

  <!-- JAVASCRIPT -->
  <script>
    // DATA PRODUK (6 Produk: 2 HP, 2 Laptop, 2 Tablet)
    // Gambar & Video diarahkan ke folder lokal (images/ dan videos/)
    const products = [
      {
        id: 1,
        category: 'hp',
        name: 'Smartphone X Pro',
        price: 'Rp 12.999.000',
        image: 'images/hp-1.jpg',
        video: 'videos/hp-1.mp4',
        desc: 'Smartphone flagship dengan chipset terbaru, layar 120Hz OLED, dan kamera pro-grade 108MP.'
      },
      {
        id: 2,
        category: 'hp',
        name: 'Smartphone Lite 5G',
        price: 'Rp 4.599.000',
        image: 'images/hp-2.jpg',
        video: 'videos/hp-2.mp4',
        desc: 'Smartphone slim stylish dengan konektivitas super cepat 5G dan baterai tahan seharian.'
      },
      {
        id: 3,
        category: 'laptop',
        name: 'Laptop Ultra Slim 14',
        price: 'Rp 16.499.000',
        image: 'images/laptop-1.jpg',
        video: 'videos/laptop-1.mp4',
        desc: 'Laptop ramping nan tangguh, bobot hanya 1.1kg dengan performa prosesor generasi terbaru.'
      },
      {
        id: 4,
        category: 'laptop',
        name: 'Laptop Gaming Beast',
        price: 'Rp 22.899.000',
        image: 'images/laptop-2.jpg',
        video: 'videos/laptop-2.mp4',
        desc: 'Performa rata kanan dengan kartu grafis RTX generasi terbaru dan pendingin pendingin ganda.'
      },
      {
        id: 5,
        category: 'tablet',
        name: 'Tab Pro Air 11"',
        price: 'Rp 9.299.000',
        image: 'images/tablet-1.jpg',
        video: 'videos/tablet-1.mp4',
        desc: 'Tablet serbaguna cocok untuk produktivitas dan ilustrasi digital dengan stylus pen responsif.'
      },
      {
        id: 6,
        category: 'tablet',
        name: 'Tab Mini Companion',
        price: 'Rp 5.199.000',
        image: 'images/tablet-2.jpg',
        video: 'videos/tablet-2.mp4',
        desc: 'Ukuran padat 8.3 inci, sangat nyaman digenggam untuk membaca, menonton, atau gaming santai.'
      }
    ];

    let cartCount = 0;
    let selectedProductId = null;

    // Render daftar produk ke halaman
    function renderProducts(categoryFilter = 'all') {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      const filteredProducts = categoryFilter === 'all' 
        ? products 
        : products.filter(p => p.category === categoryFilter);

      filteredProducts.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <!-- Gambar Produk Lokal -->
          <img src="${product.image}" alt="${product.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x220?text=${encodeURIComponent(product.name)}'">
          <div class="product-info">
            <span class="product-category">${product.category}</span>
            <h3 class="product-title">${product.name}</h3>
            <div class="product-price">${product.price}</div>
            <div class="product-actions">
              <button class="btn-detail" onclick="openModal(${product.id})">🎥 Lihat Video</button>
              <button class="btn-add" onclick="addToCart()">+ Beli</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter Kategori
    function filterCategory(category) {
      // Update active state pada tombol
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      renderProducts(category);
    }

    // Buka Modal & Set Video Lokal
    function openModal(id) {
      const product = products.find(p => p.id === id);
      if(!product) return;

      selectedProductId = id;
      document.getElementById('modalTitle').innerText = product.name;
      document.getElementById('modalPrice').innerText = product.price;
      document.getElementById('modalDesc').innerText = product.desc;

      // Set sumber video lokal & poster
      const video = document.getElementById('modalVideo');
      const source = document.getElementById('videoSource');
      source.src = product.video;
      video.poster = product.image;
      
      video.load(); // Reload video player

      document.getElementById('productModal').classList.add('active');
    }

    // Tutup Modal & Stop Video
    function closeModal() {
      const modal = document.getElementById('productModal');
      const video = document.getElementById('modalVideo');
      video.pause(); // Hentikan pemutaran video
      modal.classList.remove('active');
    }

    // Tambah Ke Keranjang
    function addToCart() {
      cartCount++;
      document.getElementById('cartCount').innerText = cartCount;
    }

    function addToCartFromModal() {
      addToCart();
      closeModal();
    }

    // Inisialisasi tampilan awal
    renderProducts('all');
  </script>
</body>
</html>
